<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Downloader</title>
    <style>
        :root {
            --bg-image: url('https://i.postimg.cc/hjzFtxPh/spider-man-5120x2880-21603.jpg');
            --overlay: rgba(0, 0, 0, 0.75);
            --card: rgba(26, 26, 26, 0.8);
            --text: #ffffff;
            --text2: #cccccc;
            --primary: #ff0050;
            --primary-hover: #cc0040;
            --secondary: #F59E0B;
            --mp3: #1E3A8A;
            --border: rgba(255, 255, 255, 0.2);
            --radius: 10px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif; color: var(--text); text-align: center;
            padding: 30px 15px; min-height: 100vh;
            background: var(--bg-image) no-repeat center center fixed; background-size: cover;
            position: relative;
        }
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--overlay); z-index: 0;
        }
        .container { position: relative; z-index: 1; max-width: 550px; margin: 0 auto; }
        h1 { color: var(--primary); margin-bottom: 5px; font-size: 24px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .by-line { color: var(--text2); font-size: 12px; margin-bottom: 25px; }
        .input-wrapper { position: relative; max-width: 100%; margin: 0 auto 10px; }
        input {
            width: 100%; padding: 14px 50px 14px 14px; border-radius: var(--radius);
            border: 1px solid var(--border); background: var(--card); color: var(--text);
            font-size: 14px; backdrop-filter: blur(5px);
        }
        .input-btns { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); display: flex; gap: 5px; }
        .input-btns button { padding: 8px 12px; background: rgba(255,255,255,0.2); color: white; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; margin: 0; }
        .input-btns button:active { background: rgba(255,255,255,0.4); }
        .input-btns .btn-x { color: #ff4444; font-weight: bold; }
        .btn-download { padding: 14px 30px; background: var(--primary); color: white; border: none; border-radius: var(--radius); font-size: 16px; cursor: pointer; margin-bottom: 15px; }
        .btn-download:active { background: var(--primary-hover); }
        #result { margin-top: 15px; }
        video { max-width: 100%; border-radius: var(--radius); margin-top: 10px; }
        .slides { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 10px; }
        .slide-item { cursor: pointer; border: 2px solid transparent; border-radius: var(--radius); overflow: hidden; width: 80px; height: 100px; }
        .slide-item.selected { border-color: var(--primary); }
        .slide-item img { width: 100%; height: 100%; object-fit: cover; }
        .dl-btn { display: inline-block; margin: 5px; padding: 12px 20px; color: white; text-decoration: none; border-radius: var(--radius); font-size: 14px; cursor: pointer; border: none; }
        .dl-btn.video { background: var(--primary); }
        .dl-btn.foto { background: var(--secondary); color: #000; font-weight: bold; }
        .dl-btn.mp3 { background: var(--mp3); }
        .footer { margin-top: 30px; color: rgba(255,255,255,0.5); font-size: 11px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>TikTok Downloader</h1>
        <p class="by-line">By Panzz</p>
        <div class="input-wrapper">
            <input id="url" placeholder="Tempel link TikTok..." />
            <div class="input-btns"><button class="btn-x" onclick="document.getElementById('url').value=''; document.getElementById('result').innerHTML='';">X</button></div>
        </div>
        <br>
        <button class="btn-download" onclick="downloadMedia()">Download</button>
        <div id="result"></div>
        <div class="footer">Made by Panzz</div>
    </div>
    <script>
        let selectedSlide = null, currentUrlHash = '';
        function shortHash(s){let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return Math.abs(h).toString(36).substring(0,4).toUpperCase();}
        async function downloadMedia(){
            const url=document.getElementById('url').value.trim(), result=document.getElementById('result'); selectedSlide=null;
            if(!url.includes('tiktok.com')){result.innerHTML='<p style="color:#ff4444;">Masukkan link TikTok!</p>';return;}
            currentUrlHash=shortHash(url); result.innerHTML='<p style="color:#ffaa00;">Memproses...</p>';
            try{
                let r=await fetch('https://tikwm.com/api/?url='+encodeURIComponent(url)+'&hd=1'), d=await r.json();
                let h='',mu='';
                if(d.code===0&&d.data){
                    if(d.data.images&&d.data.images.length>0){
                        mu=d.data.music||d.data.music_info?.url||''; h+='<div class="slides">';
                        d.data.images.forEach(i=>{h+=`<div class="slide-item" onclick="selectSlide(this,'${i}')"><img src="${i}"></div>`;});
                        h+='</div><br><button class="dl-btn foto" onclick="downloadSelected()">Download Foto Dipilih</button>';
                    }else if(d.data.play){
                        mu=d.data.music||d.data.music_info?.url||''; h+=`<video controls src="${d.data.play}"></video><br><button class="dl-btn video" onclick="forceDL('${d.data.play}','TikDwn-${currentUrlHash}.mp4')">Download Video</button>`;
                    }
                }else{throw new Error();}
                if(mu) h+=`<button class="dl-btn mp3" onclick="forceDL('${mu}','TikDwn-${currentUrlHash}.mp3')">Download MP3</button>`;
                result.innerHTML=h||'<p style="color:#ff4444;">Gagal.</p>';
            }catch(e){result.innerHTML='<p style="color:#ff4444;">Error.</p>';}
        }
        function selectSlide(e,u){document.querySelectorAll('.slide-item').forEach(el=>el.classList.remove('selected'));e.classList.add('selected');selectedSlide=u;}
        function downloadSelected(){if(selectedSlide)forceDL(selectedSlide,'TikDwn-'+currentUrlHash+'.jpg');else alert('Pilih foto dulu!');}
        async function forceDL(u,f){const b=event.target,o=b.textContent;b.textContent='Menyiapkan...';b.disabled=true;try{const r=await fetch(u),bl=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=f;document.body.appendChild(a);a.click();document.body.removeChild(a);}catch(e){alert('Gagal.');}b.textContent=o;b.disabled=false;}
    </script>
</body>
</html>
